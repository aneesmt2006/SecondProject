
services:
  api-gateway:
    build: ./api-gateway
    ports:
      - "3000:3000"
    env_file:
      - ./api-gateway/.env
    environment:
      - AUTH_SERVICE_URL=http://auth-service:3001
      - USERS_MANAGEMENT_SERVICE_URL=http://user-management-service:3002
      - MEDICAL_SERVICE_URL=http://medical-service:3003
      - APPOINMENT_SERVICE_URL=http://appointment-service:3011
      - PAYMENT_SERVICE_URL=http://payment-service:3012
      - NOTIFICATION_SERVICE_URL=http://notification-service:3015
    depends_on:
      - auth-service
      - user-management-service
      - medical-service
      - payment-service
      - appointment-service
      - notification-service

  auth-service:
    build: ./auth-service
    ports:
      - "3001:3001"
    env_file:
      - ./auth-service/.env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  user-management-service:
    build: ./user-management-service
    ports:
      - "3002:3002"
    env_file:
      - ./user-management-service/.env

  medical-service:
    build: ./medical-service
    ports:
      - "3003:3003"
    env_file:
      - ./medical-service/.env

  appointment-service:
    build: ./appointment-service
    ports:
      - "3011:3011"
    env_file:
      - ./appointment-service/.env
    environment:
      - PORT=3011
      - RABBITMQ_URL=amqp://rabbitmq:5672
    depends_on:
      - rabbitmq

  payment-service:
    build: ./payment-service
    ports:
      - "3012:3012"
    env_file:
      - ./payment-service/.env
    environment:
      - PORT=3012
      - RABBITMQ_URL=amqp://rabbitmq:5672
    depends_on:
      - auth-service
      - rabbitmq

  notification-service:
    build: ./notification-service
    ports:
      - "3015:3015"
    env_file:
      - ./notification-service/.env
    environment:
      - PORT=3015
      - RABBITMQ_URL=amqp://rabbitmq:5672
    depends_on:
      - rabbitmq

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    image: redis/redis-stack:latest
    ports:
      - "6379:6379"
      - "8001:8001"

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:2.9.3
    user: "0"
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./monitoring/loki/local-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/wal
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3005:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
      - loki

volumes:
  loki-data:
