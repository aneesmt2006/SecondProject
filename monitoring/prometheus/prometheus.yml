global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:3000']
  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:3001']
  - job_name: 'user-management-service'
    static_configs:
      - targets: ['user-management-service:3002']
  - job_name: 'medical-service'
    static_configs:
      - targets: ['medical-service:3003']
  - job_name: 'appointment-service'
    static_configs:
      - targets: ['appointment-service:3011']
  - job_name: 'payment-service'
    static_configs:
      - targets: ['payment-service:3012']
  - job_name: 'notification-service'
    static_configs:
      - targets: ['notification-service:3015']
  - job_name: 'tracking-service'
    static_configs:
      - targets: ['tracking-service:3017']
