name: Deploy Payment Service

on:
  push:
    branches:
      - main
    paths:
      - "payment-service/**"
      - ".github/workflows/deploy-payment-service.yml"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push payment-service
        uses: docker/build-push-action@v6
        with:
          context: ./payment-service
          push: true
          tags: |
            muhammedanees786/payment-service:latest
            muhammedanees786/payment-service:${{ github.sha }}

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

      - name: Deploy to K3s
        run: |
          ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/ec2_key \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
            "sudo kubectl set image deployment/payment-service \
            payment-service=muhammedanees786/payment-service:${{ github.sha }} \
            -n secondproject"

      - name: Wait for rollout
        run: |
          ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/ec2_key \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
            "sudo kubectl rollout status deployment/payment-service \
            -n secondproject --timeout=180s"